<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Games</title>
    <style>
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .game-card {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .game-card img {
            max-width: 100%;
            height: auto;
            margin-bottom: 10px;
        }
        .game-card a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Available Games</h1>
    <div class="game-grid">
        {% for game in games %}
        <div class="game-card">
            <img src="{{ url_for('get_gif', game_name=game.name) }}" alt="{{ game.name }} preview">
            <a href="{{ url_for('play_game', game_name=game.name) }}">{{ game.name }}</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
